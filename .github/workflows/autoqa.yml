name: Veriflow AutoQA Runner
on:
  workflow_dispatch:
    inputs:
      run_id:
        description: "Veriflow run ID to execute (optional — polls for EXECUTING runs)"
        required: false
        type: string
      max_shards:
        description: "Max concurrent shards (default: 4)"
        required: false
        type: string
        default: "4"

permissions:
  contents: read
  # Needed if runner pushes results back to Vercel API
  # No additional permissions required

jobs:
  runner:
    name: Runner (shard executor)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      VERIFLOW_API_BASE: ${{ secrets.VERIFLOW_API_BASE }}
      RUNNER_CALLBACK_SECRET: ${{ secrets.RUNNER_CALLBACK_SECRET }}
      RUNNER_POLL_MS: "5000"
      RUNNER_MAX_SHARD_MS: "300000"
      RUNNER_WORK_DIR: "/tmp/veriflow-runs"
    steps:
      - name: Checkout runner source
        uses: actions/checkout@v4
        with:
          path: veriflow
          sparse-checkout: |
            runner

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "26"
          cache: "npm"
          cache-dependency-path: veriflow/runner/package-lock.json

      - name: Install runner deps
        working-directory: veriflow/runner
        run: npm ci --omit=dev

      - name: Install Playwright Chromium
        working-directory: veriflow/runner
        run: npx playwright install --with-deps chromium

      - name: Start runner
        working-directory: veriflow/runner
        run: |
          # If RUN_ID provided, run single shard loop; otherwise poll for any EXECUTING run
          if [ -n "${{ github.event.inputs.run_id }}" ]; then
            echo "Targeting specific run: ${{ github.event.inputs.run_id }}"
            # Single-shot mode: poll once, run one shard, exit
            node worker.mjs --once --run-id="${{ github.event.inputs.run_id }}"
          else
            echo "Polling for EXECUTING runs..."
            node worker.mjs
          fi
        env:
          # Pass through GitHub token if needed for private repo clone
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}